services:
  dsh:
    build: .
    container_name: dsh
    ports:
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
    env_file: .env
    environment:
      DSH_HOME: /dsh-home
    volumes:
      - ./config:/dsh-home
      - ${DSH_WORKSPACE:-./workspace}:/home/node
    restart: unless-stopped

  # Session-auth login service behind the host Nginx `auth_request`.
  # Sessions are in-memory and expire after AUTH_TTL_HOURS (default 24);
  # restarting this container logs every session out immediately.
  # The container listens on 8081 (private constant); the host side is
  # published to loopback under AUTH_PORT from .env.
  auth:
    image: node:24-bookworm-slim
    container_name: dsh-auth
    user: node
    init: true
    working_dir: /app
    volumes:
      - ./auth:/app:ro
    command: ["node", "server.mjs"]
    env_file: .env
    environment:
      AUTH_PORT: "8081"
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    restart: unless-stopped
